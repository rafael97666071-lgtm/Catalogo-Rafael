
name: Importar CSV do Supabase para Turso

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preparar download do Google Drive
        run: |
          python -m pip install --upgrade gdown

      - name: Baixar CSV do Google Drive
        run: |
          gdown --fuzzy "https://drive.google.com/file/d/1KWq0pouuc28q0kXasspW5iFip8UtZcA9/view?usp=drivesdk" -O supabase-products.csv
          test -s supabase-products.csv
          ls -lh supabase-products.csv

      - name: Instalar cliente do Turso
        run: npm install @libsql/client

      - name: Verificar importador
        run: |
          test -f importar-csv-para-turso.js
          node --check importar-csv-para-turso.js

      - name: Importar produtos para o Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: node importar-csv-para-turso.js
